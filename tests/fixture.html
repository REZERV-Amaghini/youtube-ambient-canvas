<!doctype html>
<html><head><meta charset="utf-8"><title>Ambient verification</title>
<style>
html,body{margin:0;color:white;background:#0f0f0f;font:14px system-ui}ytd-app{display:block;background:#222;min-height:220vh}ytd-masthead{display:block;position:sticky;top:0;z-index:100;height:56px;background:#222;padding-left:24px;line-height:56px}
#columns{display:flex;gap:24px;padding:24px;max-width:1200px;margin:auto;background:#222}#primary{flex:1;min-width:0}#secondary{width:250px;background:#222}
#movie_player{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}.html5-video-container{position:absolute;inset:0}video{width:100%;height:100%;object-fit:contain}
.ytp-chrome-bottom{position:absolute;z-index:60;bottom:0;left:12px;right:12px;height:48px;background:#0007}.ytp-right-controls{display:flex;justify-content:flex-end;height:40px}.ytp-right-controls-left,.ytp-right-controls-right{display:flex;height:40px}
.ytp-button{border:0;color:white;background:transparent;width:48px;height:40px;cursor:pointer}#below,#description{background:#222;padding:16px}button{border-radius:8px;background:#303030;color:white;padding:8px;border:0}.thumb{height:110px;background:linear-gradient(45deg,#904eff,#ff823d);margin-bottom:12px;border-radius:10px}
.ytSpecButtonShapeNextFilled{background:#f1f1f1;color:#0f0f0f}
.ytSpecButtonShapeNextHost{position:relative;border-radius:999px}.ytSpecButtonShapeNextTonal{background:rgba(255,255,255,.1)}.ytChipShapeButtonReset{padding:0;background:transparent}.ytChipShapeActive,.ytChipShapeInactive{padding:8px 12px;margin-right:6px;border-radius:8px}.ytChipShapeActive{background:#f1f1f1;color:#0f0f0f}.ytChipShapeInactive{background:rgba(255,255,255,.1);color:white}
#full-bleed-container{display:none}ytd-watch-flexy[theater] #full-bleed-container{display:block;height:44vh;background:#000}ytd-watch-flexy[theater] #movie_player{width:100%;height:100%;aspect-ratio:auto}ytd-watch-flexy[theater] .html5-video-container{background:#000}
</style><link id="ambient-style" rel="stylesheet" href="/ambient.css"><script>if(new URLSearchParams(location.search).has('baseline'))document.querySelector('#ambient-style').href='/baseline-ambient.css';</script></head>
<body><ytd-app><ytd-masthead><div id="background">YouTube-style verification fixture</div></ytd-masthead>
<div id="content"><div id="page-manager"><ytd-watch-flexy><div id="columns"><div id="primary"><div id="primary-inner">
<div id="movie_player"><div class="html5-video-container"><video class="html5-main-video" autoplay muted playsinline></video></div><div class="ytp-chrome-bottom"><div class="ytp-right-controls"><div class="ytp-right-controls-left"><button class="ytp-settings-button ytp-button" aria-label="設定" aria-expanded="false">⚙</button></div><div class="ytp-right-controls-right"><button class="ytp-size-button ytp-button" aria-label="シアターモード">▭</button><button class="ytp-fullscreen-button ytp-button" aria-label="全画面">⛶</button></div></div></div></div>
<div id="below"><h2>動画タイトルとボタンを保持</h2><button>共有</button><button>保存</button><div id="description">説明欄の背景</div><ytd-comments id="comments">コメント欄の背景</ytd-comments></div>
</div></div><div id="secondary"><div class="thumb"></div>関連動画の文字<div class="thumb"></div></div></div></ytd-watch-flexy></div></div></ytd-app>
<script>
const browser={storage:{local:{get:async()=>({ambient:JSON.parse(localStorage.getItem('ambient')||'null')}),set:async({ambient})=>localStorage.setItem('ambient',JSON.stringify(ambient))}}};
const sample=document.createElement('canvas');sample.width=640;sample.height=360;
if(new URLSearchParams(location.search).has('enhancer')){
  const toolbarStyle=document.createElement('style');
  toolbarStyle.textContent=`
    .efyt-control-bar{display:flex;width:max-content;background:#181818;border-radius:18px;padding:0 6px;margin:8px auto}
    .efyt-control-bar button{position:relative;width:36px;height:36px;padding:6px;background:transparent;border:0;border-radius:0;cursor:pointer}
    .efyt-control-bar svg{width:24px;height:24px;fill:#cfcfcf}
    .efyt-control-bar button:hover svg{fill:#fff}.efyt-control-bar button[aria-pressed="true"] svg{fill:#ff4081}
    .efyt-control-bar button:hover::after{content:attr(data-tooltip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);padding:6px 8px;border-radius:4px;background:#181818;color:white;white-space:nowrap}
  `;
  document.head.append(toolbarStyle);
  const toolbar=document.createElement('div');toolbar.className='efyt-control-bar centered';
  toolbar.innerHTML='<button id="fixture-efyt-loop" aria-label="Demo loop" aria-pressed="false" data-tooltip="Demo loop"><svg viewBox="0 0 24 24"><path d="M4 6h13V3l5 4-5 4V8H4zm16 12H7v3l-5-4 5-4v3h13z"/></svg></button><button aria-label="Demo picture" data-tooltip="Demo picture"><svg viewBox="0 0 24 24"><path d="M2 4h20v16H2zm2 2v12h16V6zm1 10 4-5 3 3 3-4 4 6z"/></svg></button><button aria-label="Demo expand" data-tooltip="Demo expand"><svg viewBox="0 0 24 24"><path d="M2 2h8v2H4v6H2zm12 0h8v8h-2V4h-6zM2 14h2v6h6v2H2zm18 0h2v8h-8v-2h6z"/></svg></button><button aria-label="Demo options" data-tooltip="Demo options"><svg viewBox="0 0 24 24"><path d="M3 5h18v2H3zm0 6h18v2H3zm0 6h18v2H3z"/></svg></button>';
  toolbar.querySelector('button').onclick=e=>{const b=e.currentTarget;b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));};
  document.querySelector('#movie_player').after(toolbar);
  if(new URLSearchParams(location.search).has('compare-toolbar')){
    const compare=document.createElement('div');compare.id='fixture-toolbar-comparison';
    const comparisonStyle=document.createElement('style');
    comparisonStyle.textContent=`
      #fixture-toolbar-comparison{margin:8px 0;padding:12px;border-radius:12px;color:white}
      #fixture-toolbar-comparison .fixture-surface{display:inline-block;width:48%;text-align:center;border-radius:10px;background:linear-gradient(90deg,#877b9c,#c287a2,#91bbc3)}
      #fixture-toolbar-comparison .efyt-control-bar{margin:8px auto}
      html.yac-active .efyt-control-bar[data-fixture-baseline]{background-color:rgba(28,28,28,.72)!important;box-shadow:none!important;backdrop-filter:blur(12px)!important}
      html.yac-active .efyt-control-bar[data-fixture-baseline] button svg{filter:none!important}
    `;
    document.head.append(comparisonStyle);
    const previous=toolbar.cloneNode(true);previous.setAttribute('data-fixture-baseline','');previous.querySelector('[id]').removeAttribute('id');
    const before=document.createElement('div');before.className='fixture-surface';before.textContent='Before · 0.2.9';before.append(previous);
    const after=document.createElement('div');after.className='fixture-surface';after.textContent='After · 0.2.10';after.append(toolbar);
    compare.append(before,after);document.querySelector('#movie_player').after(compare);
  }
}
if(new URLSearchParams(location.search).has('surfaces')){
  document.documentElement.toggleAttribute('dark',!new URLSearchParams(location.search).has('light'));
  const surfaceStyle=document.createElement('style');
  surfaceStyle.textContent=`
    tp-yt-app-drawer#guide{position:fixed;left:0;top:56px;bottom:0;width:210px;z-index:110}
    #guide #contentContainer,#guide-wrapper,#guide-content{height:100%;background:#0f0f0f}
    #guide-wrapper,#guide-content{background:#181818}
    ytd-guide-renderer,ytd-guide-section-renderer,ytd-guide-entry-renderer{display:block}
    ytd-guide-renderer{padding:16px 12px}ytd-guide-entry-renderer{padding:12px;border-radius:8px}
    ytd-guide-entry-renderer[active],ytd-guide-entry-renderer:hover{background:#ffffff24}
    ytd-popup-container .fixture-popup{display:block;position:fixed;z-index:120;border-radius:12px;overflow:hidden;box-shadow:0 8px 32px #0005}
    yt-sheet-view-model,yt-contextual-sheet-layout,yt-list-view-model,yt-list-item-view-model,ytd-menu-popup-renderer,tp-yt-paper-listbox,ytd-multi-page-menu-renderer,ytd-simple-menu-header-renderer,ytd-notification-renderer{display:block}
    #fixture-modern-menu{left:234px;top:100px;width:240px}yt-contextual-sheet-layout{background:#282828;padding:8px 0}
    yt-list-item-view-model{padding:12px 18px}yt-list-item-view-model:hover{background:#ffffff24}
    #fixture-notifications{right:24px;top:100px;width:280px;background:#181818}
    ytd-simple-menu-header-renderer{padding:16px;border-bottom:1px solid #ffffff30;background:#232323}
    ytd-notification-renderer{padding:16px;min-height:60px}ytd-notification-renderer:hover{background:#ffffff24}
    #fixture-report-menu{right:24px;top:404px;width:180px;background:#282828}
    tp-yt-paper-listbox{background:#282828;padding:8px}tp-yt-paper-listbox button{width:100%;text-align:left;background:transparent}
    tp-yt-paper-listbox button:hover{background:#ffffff24}
    html:not([dark]) :is(ytd-guide-renderer,ytd-popup-container){color:#0f0f0f}
    html:not([dark]) #guide :is(#contentContainer,#guide-wrapper,#guide-content),html:not([dark]) :is(yt-contextual-sheet-layout,#fixture-notifications,#fixture-report-menu,tp-yt-paper-listbox,ytd-simple-menu-header-renderer){background:#fff}
    html:not([dark]) ytd-popup-container button{color:#0f0f0f}
  `;
  document.head.append(surfaceStyle);
  const guide=document.createElement('tp-yt-app-drawer');guide.id='guide';
  guide.innerHTML='<div id="contentContainer" class="style-scope tp-yt-app-drawer"><div id="guide-wrapper" class="style-scope ytd-app"><div id="guide-content" class="style-scope ytd-app"><ytd-guide-renderer><ytd-guide-section-renderer><ytd-guide-entry-renderer active>Home</ytd-guide-entry-renderer><ytd-guide-entry-renderer>Shorts</ytd-guide-entry-renderer><ytd-guide-entry-renderer>Subscriptions</ytd-guide-entry-renderer><hr><ytd-guide-entry-renderer>History</ytd-guide-entry-renderer><ytd-guide-entry-renderer>Playlists</ytd-guide-entry-renderer></ytd-guide-section-renderer></ytd-guide-renderer></div></div></div>';
  document.querySelector('ytd-app > #content').append(guide);
  const openSurfaces=document.createElement('button');openSurfaces.id='fixture-open-surfaces';openSurfaces.textContent='Open menus';
  openSurfaces.onclick=()=>{
    if(document.querySelector('#fixture-popups'))return;
    const popups=document.createElement('ytd-popup-container');popups.id='fixture-popups';
    popups.innerHTML='<yt-sheet-view-model id="fixture-modern-menu" class="fixture-popup ytSheetViewModelHost ytSheetViewModelContextual"><yt-contextual-sheet-layout class="ytContextualSheetLayoutHost"><div class="ytContextualSheetLayoutContentContainer"><yt-list-view-model><yt-list-item-view-model>Add to queue</yt-list-item-view-model><yt-list-item-view-model>Save to Watch later</yt-list-item-view-model><yt-list-item-view-model>Save to playlist</yt-list-item-view-model><yt-list-item-view-model>Share</yt-list-item-view-model><yt-list-item-view-model>Report</yt-list-item-view-model></yt-list-view-model></div></yt-contextual-sheet-layout></yt-sheet-view-model><ytd-multi-page-menu-renderer id="fixture-notifications" class="fixture-popup"><div id="header"><ytd-simple-menu-header-renderer>Notifications</ytd-simple-menu-header-renderer></div><div id="sections"><ytd-notification-renderer>Example notification<br><small>Self-authored demonstration</small></ytd-notification-renderer><ytd-notification-renderer>Another example<br><small>No account content is used</small></ytd-notification-renderer></div></ytd-multi-page-menu-renderer><ytd-menu-popup-renderer id="fixture-report-menu" class="fixture-popup"><tp-yt-paper-listbox><button>Report</button></tp-yt-paper-listbox></ytd-menu-popup-renderer>';
    document.querySelector('ytd-app').append(popups);
  };
  document.querySelector('#background').append(openSurfaces);
}
if(new URLSearchParams(location.search).has('theme')||new URLSearchParams(location.search).has('controls')){
  if(new URLSearchParams(location.search).get('theme')==='deepdark'){
    const fullTheme=document.createElement('link');
    fullTheme.id='efyt-dark-theme';fullTheme.rel='stylesheet';fullTheme.href='/test-theme.css';document.head.append(fullTheme);
  }
  // Model a theme extension's more specific page backgrounds without its code.
  const theme=document.createElement('style');
  if(new URLSearchParams(location.search).has('theme')){
    theme.textContent='#content #page-manager ytd-watch-flexy,#content #page-manager #columns,#content #page-manager #primary,#content #page-manager #below,#content #page-manager #secondary{background-color:#212121!important}';
    theme.textContent+='#content #page-manager .box,#content #page-manager ytd-watch-next-secondary-results-renderer{background-color:#212121!important}ytd-engagement-panel-section-list-renderer #content,ytd-engagement-panel-title-header-renderer #header,ytd-transcript-search-panel-renderer{background-color:#272727!important}';
  }
  document.head.append(theme);
  const metadataBox=document.createElement('div');
  metadataBox.className='box style-scope ytd-watch-flexy';
  metadataBox.id='fixture-metadata-box';
  const below=document.querySelector('#below');
  metadataBox.append(...below.childNodes);below.append(metadataBox);
  const infoWrapper=document.createElement('div');
  infoWrapper.className='style-scope ytd-watch-flexy';
  infoWrapper.id='fixture-info-wrapper';
  infoWrapper.append(...metadataBox.childNodes);metadataBox.append(infoWrapper);
  const ticketShelf=document.createElement('div');
  ticketShelf.id='ticket-shelf';ticketShelf.className='style-scope ytd-watch-flexy';
  ticketShelf.innerHTML='<ytd-ticket-shelf-renderer class="style-scope ytd-watch-flexy" style="display:block;padding:16px">Event tickets <button class="ytSpecButtonShapeNextHost ytSpecButtonShapeNextMono ytSpecButtonShapeNextTonal">Show tickets</button></ytd-ticket-shelf-renderer>';
  infoWrapper.append(ticketShelf);
  const actions=document.createElement('ytd-menu-renderer');
  actions.className='style-scope ytd-watch-metadata';
  actions.id='fixture-action-menu';
  actions.innerHTML='<button class="ytSpecButtonShapeNextHost ytSpecButtonShapeNextMono ytSpecButtonShapeNextTonal">Share <yt-touch-feedback-shape class="ytSpecTouchFeedbackShapeHost"><div class="ytSpecTouchFeedbackShapeFill" style="opacity:0;background:white"></div></yt-touch-feedback-shape></button><button class="ytSpecButtonShapeNextHost ytSpecButtonShapeNextMono ytSpecButtonShapeNextFilled">Subscribe</button>';
  theme.textContent+='yt-touch-feedback-shape .ytSpecTouchFeedbackShapeFill{opacity:0;transition:opacity .1s}button:hover yt-touch-feedback-shape .ytSpecTouchFeedbackShapeFill{opacity:.16!important}';
  infoWrapper.append(actions);
  const related=document.createElement('ytd-watch-next-secondary-results-renderer');
  related.className='style-scope ytd-watch-flexy';related.style.display='block';
  const secondary=document.querySelector('#secondary');
  related.append(...secondary.childNodes);secondary.append(related);
  const chips=document.createElement('yt-chip-cloud-renderer');
  chips.innerHTML='<yt-chip-cloud-chip-renderer selected><button class="ytChipShapeButtonReset" role="tab" aria-selected="true"><div class="ytChipShapeActive">All</div></button></yt-chip-cloud-chip-renderer><yt-chip-cloud-chip-renderer><button class="ytChipShapeButtonReset" role="tab" aria-selected="false"><div class="ytChipShapeInactive">Related</div></button></yt-chip-cloud-chip-renderer>';
  secondary.prepend(chips);
  const panel=document.createElement('ytd-engagement-panel-section-list-renderer');
  panel.style.display='block';
  panel.innerHTML='<ytd-engagement-panel-title-header-renderer style="display:block"><div id="header">Transcript panel <button>Close panel</button></div></ytd-engagement-panel-title-header-renderer><div id="content"><ytd-transcript-search-panel-renderer style="display:block;padding:12px">Transcript text stays visible</ytd-transcript-search-panel-renderer></div>';
  secondary.prepend(panel);
  if(new URLSearchParams(location.search).has('theme')){
    document.querySelector('#secondary').style.setProperty('background-color','#282233','important');
    document.querySelector('#secondary').style.setProperty('background-image','linear-gradient(#282233,#121212)','important');
    document.querySelector('#secondary').style.setProperty('box-shadow','0 0 4px #000','important');
  }
  const updateTheme=document.createElement('button');
  updateTheme.textContent='テーマの背景を変更';
  updateTheme.onclick=()=>document.querySelector('#secondary').style.setProperty('background-color','#304050','important');
  document.querySelector('#background').append(updateTheme);
}
if(new URLSearchParams(location.search).has('chat')){
  const chat=document.createElement('ytd-live-chat-frame');
  const frame=document.createElement('iframe');frame.id='chatframe';frame.src='/live_chat';
  frame.title='Live chat fixture';frame.style.cssText='width:100%;height:240px;border:1px solid #ffffff30';
  chat.append(frame);document.querySelector('#secondary').prepend(chat);
}
const g=sample.getContext('2d');let tick=0;
if(new URLSearchParams(location.search).has('store')){
  document.querySelector('#background').firstChild.textContent='YouTube Ambient Canvas · demonstration';
  document.querySelector('h2').textContent='Ambient colors · original demo video';
}
function frame(){g.fillStyle='#121b32';g.fillRect(0,0,640,360);g.fillStyle='#ad68ff';g.fillRect(100+Math.sin(tick++/20)*40,80,320,200);g.fillStyle='#ff3b62';g.fillRect(0,0,640,10);g.fillStyle='#35ff9f';g.fillRect(630,0,10,360);g.fillStyle='#396aff';g.fillRect(0,350,640,10);g.fillStyle='#ffcf4c';g.fillRect(0,0,10,360);if(new URLSearchParams(location.search).has('bars')){g.fillStyle='black';g.fillRect(0,0,640,40);g.fillRect(0,320,640,40);g.fillStyle='#ad68ff';g.fillRect(0,40,640,8);g.fillRect(0,312,640,8);}}
const diagnosticFrame=frame;
if(new URLSearchParams(location.search).has('store')){
  frame=()=>{
    const gradient=g.createLinearGradient(0,0,640,360);
    gradient.addColorStop(0,'#438cc4');gradient.addColorStop(.5,'#9e7dea');gradient.addColorStop(1,'#e798a7');
    g.fillStyle=gradient;g.fillRect(0,0,640,360);
    const center=g.createRadialGradient(330,180,15,330,180,300);center.addColorStop(0,'#081426ee');center.addColorStop(1,'#08142600');
    g.fillStyle=center;g.fillRect(0,0,640,360);
    g.strokeStyle='#ffffffaa';g.lineWidth=2;g.beginPath();g.ellipse(320,180,80,80,0,0,Math.PI*2);g.stroke();
    g.beginPath();g.ellipse(320,180,27,27,0,0,Math.PI*2);g.stroke();
    g.font='12px system-ui';g.fillStyle='#ffffffaa';g.textAlign='center';g.fillText('ORIGINAL DEMO GRAPHICS',320,310);
    tick++;
  };
}
frame();setInterval(frame,1000/60);
document.querySelector('video').srcObject=sample.captureStream(60);
document.querySelector('.ytp-settings-button').onclick=e=>{const b=e.currentTarget;b.setAttribute('aria-expanded',String(b.getAttribute('aria-expanded')!=='true'));};
const theaterContainer=document.createElement('div');theaterContainer.id='full-bleed-container';
const watch=document.querySelector('ytd-watch-flexy'),moviePlayer=document.querySelector('#movie_player'),originalPlayerParent=moviePlayer.parentElement;
const fullBleedPlayer=document.createElement('div');fullBleedPlayer.id='player-full-bleed-container';fullBleedPlayer.className='style-scope ytd-watch-flexy';fullBleedPlayer.style.height='100%';theaterContainer.append(fullBleedPlayer);
watch.prepend(theaterContainer);
document.querySelector('.ytp-size-button').onclick=()=>{const theater=!watch.hasAttribute('theater');watch.toggleAttribute('theater',theater);if(theater)fullBleedPlayer.append(moviePlayer);else originalPlayerParent.prepend(moviePlayer);window.dispatchEvent(new Event('resize'));};
document.querySelector('.ytp-fullscreen-button').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.querySelector('#movie_player').requestFullscreen();};
</script><script src="/renderer.js"></script><script>const ambientScript=document.createElement('script');ambientScript.src=new URLSearchParams(location.search).has('baseline')?'/baseline-ambient.js':'/ambient.js';document.body.append(ambientScript);</script></body></html>
